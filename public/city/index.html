<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metroplex - Animated 3D City</title>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0f1420}
  body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#FAFAF9}
  a{color:#1D9BB0;text-decoration:none}
  a:hover{color:#7FD1EE}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .panel{position:fixed;background:rgba(14,21,34,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.13);
         border-radius:12px;box-shadow:0 14px 40px rgba(4,8,16,.45)}
  .lbl{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(250,250,249,.55)}

  #header{top:22px;left:24px;display:flex;align-items:center;gap:14px;padding:11px 20px 11px 14px}
  #header .burger{display:grid;gap:3px;padding:4px;cursor:pointer}
  #header .burger i{display:block;width:16px;height:2px;background:#FAFAF9;border-radius:2px;opacity:.85}
  #header h1{font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  #header h1 span{color:#1D9BB0}
  #header .exp{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#1D9BB0;
        border:1px solid rgba(29,155,176,.5);border-radius:999px;padding:5px 10px}
  #header .exp:hover{background:rgba(29,155,176,.16);color:#7FD1EE}
  #header .count{font-size:10px;font-weight:800;letter-spacing:.12em;color:rgba(250,250,249,.45);
        border-left:1px solid rgba(255,255,255,.16);padding-left:14px}

  #layers{top:22px;right:24px;width:214px;padding:14px 16px 12px}
  #layers .rows{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  #layers .row{display:flex;align-items:center;gap:10px;cursor:pointer}
  #layers .row .ic{width:18px;text-align:center;font-size:13px}
  #layers .row .nm{flex:1;font-size:12.5px;font-weight:700;letter-spacing:.01em}
  .sw{width:34px;height:18px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;transition:background .2s ease;flex:none}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#FAFAF9;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
  .row.on .sw{background:var(--c,#1D9BB0)}
  .row.on .sw::after{transform:translateX(16px)}
  #layers .row:not(.on) .nm{color:rgba(250,250,249,.45)}

  /* district switcher */
  #districts{bottom:24px;left:24px;width:212px;padding:14px 12px 10px}
  #districts .lbl{padding-left:4px}
  #districts .items{display:flex;flex-direction:column;gap:1px;margin-top:10px}
  #districts .it{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;
        transition:background .15s ease}
  #districts .it:hover{background:rgba(255,255,255,.07)}
  #districts .it.on{background:rgba(255,255,255,.11)}
  #districts .it .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  #districts .it .nm{flex:1;font-size:12.5px;font-weight:700;letter-spacing:.005em}
  #districts .it .tg{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(250,250,249,.4)}
  #districts .it.all .dot{background:linear-gradient(135deg,#58A83A,#2E7BD6 40%,#9B5DE0 70%,#E8862E)}

  #search{position:fixed;bottom:24px;left:256px;width:230px;display:flex;align-items:center;gap:9px;padding:11px 14px}
  #search input{flex:1;background:none;border:none;outline:none;color:#FAFAF9;font:600 12.5px/1 inherit}
  #search input::placeholder{color:rgba(250,250,249,.4)}
  #search.miss{border-color:rgba(224,83,60,.7)}

  #zoomer{right:24px;bottom:24px;display:flex;flex-direction:column;gap:4px;padding:6px}
  #zoomer .grid{display:flex;gap:4px}
  .tbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font-size:14px;font-weight:800;
        color:rgba(250,250,249,.82);cursor:pointer;transition:background .15s ease,color .15s ease}
  .tbtn:hover{background:rgba(255,255,255,.1);color:#fff}

  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .mlabel{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
          transition:opacity .25s ease;white-space:nowrap}
  .mlabel .pin{position:absolute;left:50%;top:100%;width:1px;height:16px;background:rgba(255,255,255,.35);transform:translateX(-50%)}
  .mlabel .body{background:rgba(12,19,31,.86);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);
          border-radius:7px;padding:7px 11px;box-shadow:0 8px 22px rgba(4,8,16,.4)}
  .mlabel .nm{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .mlabel .mt{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:rgba(250,250,249,.6);margin-top:3px}
  .mlabel.sel .body{background:#1D9BB0;border-color:rgba(255,255,255,.5)}
  .mlabel.sel .mt{color:rgba(255,255,255,.85)}
  .mlabel.pinlike .body{display:flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px 6px 7px}
  .mlabel.pinlike .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#1D9BB0}
  .mlabel.pinlike .mt{display:none}
  .mlabel.hide{opacity:0;pointer-events:none}

  #card{position:fixed;right:24px;top:290px;width:278px;padding:18px 18px 16px;opacity:0;transform:translateY(10px);
        transition:opacity .26s ease,transform .26s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  #card.on{opacity:1;transform:none;pointer-events:auto}
  #card .tier{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
        color:#061018;background:#1D9BB0;border-radius:999px;padding:4px 9px}
  #card h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:11px;line-height:1.15}
  #card .desc{font-size:12.5px;line-height:1.5;color:rgba(250,250,249,.66);margin-top:7px;font-weight:500}
  #card .stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
  #card .stat .k{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(250,250,249,.45)}
  #card .stat .v{font-size:15px;font-weight:800;margin-top:2px}
  #card .stat .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
  #card .close{position:absolute;top:14px;right:14px;font-size:13px;color:rgba(250,250,249,.5);cursor:pointer}

  #dcard{position:fixed;right:24px;top:290px;width:278px;padding:16px 18px 14px;opacity:0;transform:translateY(10px);
        transition:opacity .26s ease,transform .26s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  #dcard.on{opacity:1;transform:none;pointer-events:auto}
  #dcard .tier{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
        color:#061018;border-radius:999px;padding:4px 9px}
  #dcard h2{font-size:18px;font-weight:800;margin-top:10px}
  #dcard .desc{font-size:12.5px;line-height:1.5;color:rgba(250,250,249,.66);margin-top:7px;font-weight:500}
  #dcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px;
        border-top:1px solid rgba(255,255,255,.14);padding-top:11px}
  #dcard .k{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:rgba(250,250,249,.45)}
  #dcard .v{font-size:14px;font-weight:800;margin-top:2px}
  #dcard .tk{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
  #dcard .tk span{font:800 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;padding:5px 7px;
        border-radius:5px;background:rgba(255,255,255,.09);cursor:pointer}
  #dcard .tk span:hover{background:rgba(255,255,255,.2)}

  #hint{position:fixed;bottom:116px;right:24px;font-size:10px;font-weight:800;letter-spacing:.1em;
        text-transform:uppercase;color:rgba(250,250,249,.42);pointer-events:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1420;z-index:9;
        color:#FAFAF9;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;transition:opacity .5s ease}
  #loading.off{opacity:0;pointer-events:none}
</style>

<style>
  :root{
    --noir-950:#110905; --noir-900:#1B120C; --noir-800:#2C1F16;
    --noir-100:#F0E7E0; --noir-300:#BCA898;
    --amber-500:#E8A33D; --amber-400:#F0BE6D;
  }
  html,body{background:transparent !important}

  /* editor chrome: present for JS, never shown */
  #header,#layers,#districts,#search,#zoomer,#hint,#loading{
    display:none !important;
  }

  /* info cards, rebranded */
  #card,#dcard{
    background:rgba(17,9,5,.92) !important;
    border:1px solid rgba(232,163,61,.30) !important;
    border-radius:4px !important;
    box-shadow:0 18px 50px rgba(0,0,0,.55) !important;
    backdrop-filter:blur(16px);
    font-family:ui-sans-serif,system-ui,sans-serif;
  }
  #card .tier,#dcard .tier{
    background:var(--amber-500) !important; color:var(--noir-950) !important;
    border-radius:2px !important; letter-spacing:.14em !important;
  }
  #card h2,#dcard h2{color:var(--noir-100) !important;letter-spacing:-.005em}
  #card .desc,#dcard .desc{color:var(--noir-300) !important}
  #card .stats,#dcard .stats{border-top-color:rgba(232,163,61,.20) !important}
  #card .stat .k,#dcard .k{color:rgba(188,168,152,.75) !important}
  #card .stat .v,#dcard .v{color:var(--noir-100) !important}
  #card .stat .v.mono{color:var(--amber-400) !important}
  #card .close,#dcard .close{color:rgba(188,168,152,.7) !important}
  #card .close:hover,#dcard .close:hover{color:var(--amber-400) !important}
  #dcard .tk span{background:rgba(232,163,61,.12) !important;color:var(--noir-100) !important}

  /* building label, shown on selection only */
  .mlabel .body{
    background:rgba(17,9,5,.88) !important;
    border:1px solid rgba(232,163,61,.28) !important;
    border-radius:3px !important;
  }
  .mlabel .nm{color:var(--noir-100) !important;letter-spacing:.1em !important}
  .mlabel .mt{color:rgba(188,168,152,.8) !important}
  .mlabel.sel .body{background:var(--amber-500) !important;border-color:var(--amber-400) !important}
  .mlabel.sel .nm{color:var(--noir-950) !important}
  .mlabel.sel .mt{color:rgba(17,9,5,.75) !important}
  .mlabel .pin{background:rgba(232,163,61,.45) !important}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div class="panel" id="header">
  <div class="burger"><i></i><i></i><i></i></div>
  <h1>City Overview: <span>Metroplex</span></h1>
  <div class="count">9 Districts · 47 Sites</div>
  <a class="exp" href="City Massing Export.html">Export 3D ↗</a>
</div>

<div class="panel" id="layers">
  <div class="lbl">Layer selection</div>
  <div class="rows">
    <div class="row on" data-layer="tickers" style="--c:#FAFAF9"><div class="ic">$</div><div class="nm">Tickers</div><div class="sw"></div></div>
    <div class="row" data-layer="districts" style="--c:#9B5DE0"><div class="ic">▦</div><div class="nm">District tint</div><div class="sw"></div></div>
    <div class="row on" data-layer="transit" style="--c:#1D9BB0"><div class="ic">◈</div><div class="nm">Transit</div><div class="sw"></div></div>
    <div class="row" data-layer="zoning" style="--c:#E6E3DB"><div class="ic">▤</div><div class="nm">Zoning</div><div class="sw"></div></div>
    <div class="row on" data-layer="traffic" style="--c:#E0533C"><div class="ic">▲</div><div class="nm">Traffic</div><div class="sw"></div></div>
    <div class="row on" data-layer="parks" style="--c:#3FA6A0"><div class="ic">✦</div><div class="nm">Parks</div><div class="sw"></div></div>
    <div class="row on" data-layer="energy" style="--c:#D9A441"><div class="ic">⚡</div><div class="nm">Energy</div><div class="sw"></div></div>
  </div>
</div>

<div class="panel" id="districts">
  <div class="lbl">Districts</div>
  <div class="items" id="dlist"></div>
</div>
<div class="panel" id="search"><span style="opacity:.5;font-size:12px">⌕</span><input placeholder="Search ticker or building"></div>

<div class="panel" id="zoomer">
  <div class="grid">
    <div class="tbtn" data-act="in">+</div>
    <div class="tbtn" data-act="out">−</div>
    <div class="tbtn" data-act="labels">◈</div>
  </div>
  <div class="grid">
    <div class="tbtn" data-act="left">‹</div>
    <div class="tbtn" data-act="reset">◌</div>
    <div class="tbtn" data-act="right">›</div>
  </div>
</div>

<div class="panel" id="card">
  <div class="close">✕</div>
  <span class="tier"></span>
  <h2></h2>
  <div class="desc"></div>
  <div class="stats">
    <div class="stat"><div class="k">Ticker</div><div class="v mono" data-k="t"></div></div>
    <div class="stat"><div class="k">Height</div><div class="v" data-k="h"></div></div>
    <div class="stat"><div class="k">Program</div><div class="v" data-k="p"></div></div>
    <div class="stat"><div class="k">District</div><div class="v" data-k="d" style="font-size:12.5px"></div></div>
  </div>
</div>

<div class="panel" id="dcard">
  <div class="close">✕</div>
  <span class="tier"></span>
  <h2></h2>
  <div class="desc"></div>
  <div class="stats">
    <div><div class="k">Jobs</div><div class="v" data-k="jobs"></div></div>
    <div><div class="k">Load</div><div class="v" data-k="power"></div></div>
    <div><div class="k">Area</div><div class="v" data-k="area"></div></div>
  </div>
  <div class="tk"></div>
</div>

<div id="hint">Drag · Scroll · Click a building</div>
<div id="loading">Building city…</div>

<script type="module" src="city-main.js"></script>
</body></html>
